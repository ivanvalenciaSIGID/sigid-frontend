<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SIGID - Captura de Incidencias con Mapa</title>

  <!-- CSS propio -->
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <h1>SIGID - Captura de Incidencias</h1>

  <form id="formIncidencia">
    <label for="fecha">Fecha:</label>
    <input type="datetime-local" id="fecha" required>

    <label for="tipo">Tipo de incidencia:</label>
    <select id="tipo" required>
      <option value="">--Selecciona--</option>
      <option value="Robo">Robo</option>
      <option value="Asalto">Asalto</option>
      <option value="Vandalismo">Vandalismo</option>
      <option value="Otro">Otro</option>
    </select>

    <label>Ubicación en el mapa:</label>
    <div id="map"></div>
    <input type="hidden" id="lat">
    <input type="hidden" id="lng">

    <button type="submit">Enviar Incidencia</button>
  </form>

  <button id="btnTestGet">Probar Conexión GET</button>

  <div id="resultado"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz8hPvMK5SEDni0j_kjbWCqLOSFEFigvoCkO8hXN9RVOrmkkmaPDkQhOKC1peAjeh4sFQ/exec';
    const resultadoDiv = document.getElementById('resultado');
    const form = document.getElementById('formIncidencia');

    // Inicializar mapa
    const map = L.map('map').setView([19.2428, -103.7278], 13); // Colima centro aproximado
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;

    map.on('click', function(e) {
      const { lat, lng } = e.latlng;
      if (marker) marker.setLatLng(e.latlng);
      else marker = L.marker([lat, lng]).addTo(map);

      document.getElementById('lat').value = lat;
      document.getElementById('lng').value = lng;
    });

    // Función para enviar POST
    async function sendDataPOST(fecha, tipo, lat, lng) {
      try {
        const payload = { fecha, tipo, lat, lng };

        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        resultadoDiv.textContent = `✅ POST exitoso:\n${JSON.stringify(data, null, 2)}`;
      } catch (error) {
        resultadoDiv.textContent = `❌ Error POST:\n${error}`;
      }
    }

    // Función GET
    async function testGET() {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await response.json();
        resultadoDiv.textContent = `✅ GET exitoso:\n${JSON.stringify(data, null, 2)}`;
      } catch (error) {
        resultadoDiv.textContent = `❌ Error GET:\n${error}`;
      }
    }

    // Evento del formulario
    form.addEventListener('submit', e => {
      e.preventDefault();
      const fecha = document.getElementById('fecha').value;
      const tipo = document.getElementById('tipo').value;
      const lat = document.getElementById('lat').value;
      const lng = document.getElementById('lng').value;

      if (!fecha || !tipo || !lat || !lng) {
        resultadoDiv.textContent = '❌ Todos los campos y la ubicación en el mapa son obligatorios.';
        return;
      }

      sendDataPOST(fecha, tipo, lat, lng);
      form.reset();
      if (marker) { map.removeLayer(marker); marker = null; }
    });

    // Evento botón GET
    document.getElementById('btnTestGet').addEventListener('click', testGET);
  </script>

</body>
</html>
