<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario SIGID</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Registro de Incidencias - SIGID</h1>

    <form id="sigidForm">
      <!-- Campo de fecha -->
      <label for="fecha">Fecha:</label>
      <input type="date" id="fecha" name="fecha" required />

      <!-- Campo de tipo -->
      <label for="tipo">Tipo de incidencia:</label>
      <select id="tipo" name="tipo" required>
        <option value="">Seleccione una opción</option>
        <option value="Robo">Robo</option>
        <option value="Asalto">Asalto</option>
        <option value="Vandalismo">Vandalismo</option>
        <option value="Otro">Otro</option>
      </select>

      <!-- Campo de ubicación -->
      <label for="ubicacion">Ubicación (coordenadas o dirección):</label>
      <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej. 19.2434, -103.7245" required />

      <button type="submit">Enviar registro</button>
    </form>

    <p id="estado" class="estado"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
